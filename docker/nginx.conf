# Serves the built single-page app: real files as-is, every other path
# (client-side routes like /rust-atomics-and-locks/sections/...) gets
# index.html so React Router can handle it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change - cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
